{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <style>
        * {
            margin: 0%;
            padding: 0%;
        }

        body {
            background-image: url('{% static "assests/register_background.jpg" %}');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            width: 100%;
            height: 90vh;
        }
        
        form {
            height: 400px;
            width: 330px;
            background-color: rgba(255, 255, 255, 0.13);
            position: absolute;
            transform: translate(-50%, -50%);
            top: 54%;
            left: 44%;
            padding: 30px 30px;
        }

        form * {
            font-family: 'Poppins', sans-serif;
            letter-spacing: 0.5px;

        }
        
        input {
            height: 40px;
            width: 90%;
            border-radius: 3px;
            padding: 0 10px;
            margin-top: 8px;
            font-size: 14px;
            border: 2px solid skyblue;
        }

        button {
            margin-top: 25px;
            width: 100%;
            background-color: skyblue;
            color: white;
            padding: 10px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
        }
        button:hover{
            background-color: darkblue;
        }
        form h3 {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-size: 30px;
            text-align: center;
            color: black;
        }
        .img1{
            width: 50%;
            height: 100%;
            margin-left: 30%;
            margin-top: 1%;
        }

    </style>
</head>

<body>
    <img src="{% static '/assests/registartion.jpg' %}" alt="img" class="img1">
    {% for message in messages %}
    <h3>{{message}}</h3>
    {% endfor %}
    <form action="{% url 'register' %}" method="post">
        {% csrf_token %}
        <h3>Register Here</h3>

        <input type="text" name="reg_no" placeholder="Registartion number" required>
        <input type="text" name="username" placeholder="student name" required>
        <input type="number" name="year" placeholder="year" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password1" placeholder="password" required>
        <input type="password" name="password2" placeholder="confirm password" required>
        <button type="submit">Register</button>
        <p>Already have an account...👉<a href="{% url 'login' %}">Login</a></p>

    </form>
</body>

</html>
