{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification</title>
    <style>
        body{
            background-image: url('{% static "/assests/otp.avif" %}');
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            height: 77vh;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        p {
            text-align: center;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        input {
            padding: 10px;
            border: 1 px solid lightgray;
            border-radius: 4px;
        }

        button {
            width: 150px;
            padding: 10px;
            background-color: rgb(34, 157, 233);
            color: #fff;
            border: 1 px solid blue;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-left: 10%;
        }

        button:hover {
            background-color: #003874;
        }

        ul {
            list-style-type: none;
        }

        li {
            color: red;
        }
        .box{
            height: 40VH;
            width: 30%;
            border: 5px solid black;
            margin-left: 35%;
            margin-top: 10%;
        }
    </style>
</head>

<body>
    <div class="box">
        <h2>OTP Verification</h2>
        <p>Please enter the OTP sent to your email:</p>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Verify OTP</button>
        </form>

        {% if messages %}
        <ul>
            {% for message in messages %}
            <li>{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}
    </div>
</body>

</html>
