{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">


    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .heading {
            font-variant: small-caps;
            text-shadow: 2px 1px 2px rgb(65, 60, 137);
            margin-top: 1;
        }

        li {
            list-style-type: none;
        }

        a {
            color: black;
            text-decoration: none;
        }

        .sidebar {
            height: 100%;
            width: 200px;
            position: absolute;
            top: 12%;
            background-color: #111;
        }

        .sidebar a {
            padding: 6px 8px 6px 16px;
            text-decoration: none;
            font-size: 15px;
            color: #818181;
            display: block;
        }

        .main {
            background-image: url('{% static "/assests/dashboard.jpg" %}');
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            height: 88vh;
            overflow-x: hidden;
        }
        img:hover{
            transform: scale(1.1);
            transition: 0.5s ease;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <form method="post" action="{% url 'dashboard' %}">

        <header class="col-12 d-flex" style="background-color: lightgray;height: 80px;">
            <div class="col-6">
                <h1 class="heading">student feedback management system</h1>
            </div>
            <div class="col-6">
                <ul class="d-flex justify-content-evenly mt-4">
                    <li><a href="">Home</a></li>
                    <li>|</li>
                    <li><a href="{% url 'about' %}">About</a></li>
                    <li>|</li>
                    <li><a href="{% url 'login' %}">Student</a></li>
                    <li>|</li>
                    <li><a href="{% url 'admin_login' %}">Admin</a></li>
                    <li>|</li>
                    <li><a href="{% url 'contact' %}">contact us</a></li>

                </ul>
            </div>
        </header>
        <div class="col-12 main">
            <div class="col-12">
                {% csrf_token %}
                {% for i in data2 %}
                <h1 style="margin-left: 25%;font-variant: small-caps;">welcome to the dashboard..<span
                        style="color: rgb(13, 0, 255);font-variant: small-caps;font-size: 40px;">{{ i.username }}</span>!
                </h1>
                {% endfor %}
            </div>
            <div class="col-12 d-flex" style="margin-left: 10%;">
                <div class="col-6 ms-5 mt-5">
                    <a href="{% url 'feedback' %}"><img src="{% static '/assests/dashboard1.png'%}" alt=""></a>
                    <h3 class="ms-4 mt-1" style="font-variant: small-caps;">submit feedback</h3>
                </div>

                <div class="col-6 ms-5 mt-5">
                    <a href="{% url 'logout' %}"><img src="{% static '/assests/dashboard3.png'%}" alt="" width="30%"></a>
                    <h3 class="ms-4 mt-1" style="font-variant: small-caps;">Click to Logout</h3>
                </div>
                
            </div>
           
        </div>



    </form>
</body>

</html>
