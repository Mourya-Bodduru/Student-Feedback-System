
{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css?family=Ubuntu" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <title>Admin Login</title>
    <style>
        body {
            font-family: 'Ubuntu', sans-serif;
            background-image: url('{% static "/assests/admin_login.jpeg" %}');
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            height: 75vh;
        }

        .main {
            width: 400px;
            height: 400px;
            margin: 10em auto;
            margin-left: 50%;
            border: 2px solid rgb(255, 255, 255);
            border-radius: 10%;
        }

        .sign {
            color: #000000;
            margin-left: 40%;
        }
        .sign1{
            color: #ffffff;
            text-align: center;
            text-shadow:1px 0px 1px rgb(0, 0, 0);
            font-size: 30px;        }
        .un,
        .pass {
            width: 80%;
            color: white;
            font-size: 15px;
            padding: 10px;
            background-color: transparent;
            border-radius: 20px;
            box-sizing: border-box;
            border: 2px solid white;
            margin-bottom: 40px;
            margin-left: 46px;
            padding-left: 50px; /* Adjust this value based on the icon size */
        }
        .un::placeholder,
        .pass::placeholder {
            color: rgb(46, 46, 46);
        }
        .un-icon,
        .pass-icon {
            position: absolute;
            padding: 10px;
            color: white;
        }
        .un-icon {
            left: 12%;
        }
        .pass-icon {
            left: 12%;
        }
        .submit {
            cursor: pointer;
            border-radius: 20px;
            width: 45%;
            height: 5vh;
            color: #fff;
            font-size: 25px;
            background: transparent;
            border: 2px solid white;
            margin-left: 27%;
        }
        .submit:hover{
            background-color: blue;
            color: black;
            border: 2px solid black;
        }
        .error{
            color: rgb(4, 255, 0);
            font-variant: small-caps;
            font-size: 20px;
            text-align: center;
        }
        .logo{
            margin-left: 42%;
        }
      
    </style>
</head>

<body>
    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}
    <div class="main">
     
        <form method="post" class="form1" action="{% url 'admin_login' %}">
            {% csrf_token %}
            <h2 class="sign1">Admin Login</h2>
           
            <img src="{% static '/assests/user1.png' %}" alt="" width="15%" class="logo" >
            <div>
                <br>
                <div style="position: relative;">
                    <i class="bi bi-person-fill un-icon"></i>

                    <input type="text" name="username" class="form-control un" placeholder="Username" required>
                </div>
            </div>
            <div>
                <div style="position: relative;">
                    <i class="bi bi-lock-fill pass-icon"></i>
                    <input type="password" name="password" class="form-control pass" placeholder="Password" required>
                    
                </div>
            </div>
            <button type="submit" class="submit">Login</button>
        </form>
    </div>
</body>


</html>
